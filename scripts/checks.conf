# Settings for the check scripts in this directory: what each check reads in
# this repository. It is sourced by bash, so it holds plain variable
# assignments only.
#
# The *_FILES settings are git pathspecs, relative to the repository root. The
# scripts expand them with `git ls-files`, so they match tracked files and new
# files that are not ignored, but never build output: doc/ holds generated HTML
# and text beside the sources once the manuals have been built in place.

# Which repository this is: "sd" (the source and documentation) or
# "sd-regression" (the private regression suite).
REPO_KIND=sd

# Texinfo manuals, checked by scripts/check-doc-prose.sh and built by
# scripts/build-docs.sh.
TEXINFO_FILES=('doc/*.txi')

# Markdown checked by PyMarkdown. The GitHub templates are bodies for a form
# rather than documents (an issue template starts at a second-level heading),
# so PyMarkdown skips them.
MARKDOWN_FILES=('README.md' 'CONTRIBUTING.md' '.claude/*.md')

# Markdown checked by scripts/check-doc-prose.sh, against its baseline: the
# user and developer documentation. The Claude Code rules and skills in
# .claude/ are not checked.
PROSE_MARKDOWN_FILES=('README.md' 'CONTRIBUTING.md' '.github/*.md')

# Files checked by codespell, against its baseline. The C++ sources are not
# included: these checks cover the documentation and the tooling.
# The Claude Code rules and skills in .claude/ are not checked.
SPELL_FILES=('README.md' 'CONTRIBUTING.md' 'doc/*.txi' 'doc/*.html' 'doc/*.htmli'
             'doc/howtobuild.txt' 'src/db_doc.txt' 'scripts/*' '.github/*')

# Shell scripts checked by ShellCheck. The upstream release scripts in doc/ and
# src/ are not checked.
SHELL_FILES=('scripts/*.sh')

# GitHub Actions workflows checked by actionlint.
WORKFLOW_FILES=('.github/workflows/*.yml')
