# .readthedocs.yaml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
#
# Builds the developer guide in docs/. The manuals in doc/ are Texinfo and are
# not built here; scripts/build-docs.sh builds them.

# Required
version: 2

# Set the OS, Python version and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

# Build documentation in the "docs/" directory with Sphinx
sphinx:
  configuration: docs/conf.py
  # Fail the build on any warning, as CI and scripts/run-all-checks.sh do
  fail_on_warning: true

# Sd is not a Python package, so install only the guide's pinned requirements
python:
  install:
    - requirements: docs/requirements.txt
